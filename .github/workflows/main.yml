name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyni yuklash
        uses: actions/checkout@v4

      - name: Java muhitini o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK o'rnatish
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Android platformasini yaratish
        run: |
          rm -rf android
          flutter create . --project-name toat_app --org com.toat.app --platforms=android

      - name: Kutubxonalarni yuklash
        run: flutter pub get

      - name: APK faylni yig'ish (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: APK ni yuklab olishga chiqarish
        uses: actions/upload-artifact@v4
        with:
          name: toat-namoz-kundaligi
          path: build/app/outputs/flutter-apk/app-release.apk
